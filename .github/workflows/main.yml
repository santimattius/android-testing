name: Checks

# Cadence follows the Android CI guidance: fast, small tests on every change; slower device
# tests on the main branch and nightly.
# https://developer.android.com/training/testing/continuous-integration/automation
on:
  push:
    branches: [ master ]
  # Any base branch, so chained (stacked) pull requests are validated too.
  pull_request:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detekt:
    name: Detekt - Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}
      - name: DeteKt
        uses: natiginfo/action-detekt-all@1.23.7
        with:
          args: --config config/detekt/detekt.yml

  unit-tests:
    name: Unit tests, lint and coverage
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Unit tests and lint
        run: ./gradlew test lint --stacktrace

      - name: Unit test coverage reports
        run: ./gradlew createDebugUnitTestCoverageReport

      - name: Coverage regression check
        run: ./gradlew coverageRegressionCheck -PcoverageKinds=test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
            **/build/reports/coverage/test/
          if-no-files-found: ignore

  instrumented-tests:
    name: Instrumented tests (Gradle-managed device)
    runs-on: ubuntu-latest
    # Device tests are slower, so they run on the main branch, nightly and on demand.
    if: github.event_name != 'pull_request'
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # GitHub-hosted runners lack hardware rendering, so the emulator needs a software GPU.
      # https://developer.android.com/studio/test/gradle-managed-devices
      - name: Instrumented tests
        run: >
          ./gradlew pixel9api35DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore
